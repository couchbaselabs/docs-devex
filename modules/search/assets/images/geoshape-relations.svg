<svg xmlns="http://www.w3.org/2000/svg" width="870" height="369" viewBox="0 40 1392 590" role="img" aria-labelledby="title desc">
  <title id="title">Geoshape query relations: within, intersects, and contains</title>
  <desc id="desc">Three diagrams comparing a query shape and an indexed shape. Within: the query shape fully covers the indexed shape. Intersects: the shapes overlap, but neither fully covers the other. Contains: the indexed shape fully covers the query shape.</desc>
  <style>
    .query { fill: #4a86d0; fill-opacity: 0.2; stroke: #8aaed8; stroke-width: 2.5; }
    .indexed { fill: #e8795a; fill-opacity: 0.2; stroke: #eaa58c; stroke-width: 2.5; }
    .heading { font-family: "DejaVu Sans", Verdana, Arial, sans-serif; font-size: 23px; font-weight: bold; fill: #333333; text-anchor: middle; }
    .caption { font-family: "DejaVu Sans", Verdana, Arial, sans-serif; font-size: 15px; fill: #555555; text-anchor: middle; }
    .legend { font-family: "DejaVu Sans", Verdana, Arial, sans-serif; font-size: 18px; fill: #222222; }
  </style>
  <rect x="0" y="40" width="1392" height="590" fill="#ffffff"/>

  <!-- within -->
  <text class="heading" x="284" y="83">within</text>
  <circle class="query" cx="284" cy="280" r="160"/>
  <circle class="indexed" cx="303" cy="307" r="65"/>
  <text class="caption" x="284" y="502">query shape fully covers the indexed shape</text>

  <!-- intersects -->
  <text class="heading" x="696" y="83">intersects</text>
  <circle class="query" cx="646" cy="288" r="103"/>
  <circle class="indexed" cx="745" cy="288" r="103"/>
  <text class="caption" x="696" y="502">shapes overlap; neither fully covers the other</text>

  <!-- contains -->
  <text class="heading" x="1107" y="83">contains</text>
  <circle class="indexed" cx="1107" cy="288" r="153"/>
  <circle class="query" cx="1119" cy="277" r="57"/>
  <text class="caption" x="1107" y="502">indexed shape fully covers the query shape</text>

  <!-- legend -->
  <rect class="query" x="476" y="587" width="38" height="16" rx="2"/>
  <text class="legend" x="529" y="602">query shape</text>
  <rect class="indexed" x="684" y="587" width="38" height="16" rx="2"/>
  <text class="legend" x="738" y="602">indexed shape</text>
</svg>
